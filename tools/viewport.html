<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка вёрстки</title>

    <!--
        Страница-обёртка для проверки адаптивности.

        Зачем iframe: браузер в headless-режиме не позволяет задать вьюпорт
        уже ~492 px, поэтому страница приложения открывается внутри фрейма
        нужной ширины. Медиазапросы внутри фрейма считаются по его ширине,
        то есть 390 px в iframe — это честные 390 px для вёрстки.

        Параметры в адресной строке:
            page  — путь к странице приложения
            role  — guest | user | admin  (для admin/user выполняется вход)
            w, h  — ширина и высота фрейма в пикселях
    -->

    <style>
        body { margin: 0; background: #222; font: 13px sans-serif; color: #fff; }
        iframe { border: 0; display: block; width: 390px; height: 844px; background: #fff; }
        p { margin: 6px 10px; }
    </style>
</head>
<body>
<p id="cap">загрузка…</p>
<iframe id="f" title="Предпросмотр страницы"></iframe>

<script>
    var params = new URLSearchParams(location.search);
    var page = params.get('page') || '/index.php';
    var role = params.get('role') || 'guest';
    var h = parseInt(params.get('h') || '844', 10);
    var w = parseInt(params.get('w') || '390', 10);

    var frame = document.getElementById('f');
    frame.style.width = w + 'px';
    frame.style.height = h + 'px';

    document.getElementById('cap').textContent =
        page + ' — ' + role + ' — ' + w + '×' + h;

    var creds = role === 'admin'
        ? { login: 'Admin', password: 'VetLapa1' }
        : { login: 'petrov01', password: 'vetpass1' };

    if (role === 'guest') {
        frame.src = page;
    } else {
        // Вход выполняется до загрузки страницы в iframe.
        // redirect: 'follow' обязателен — при 'manual' браузер не обрабатывает
        // Set-Cookie из ответа 302, и сессия не создаётся.
        fetch('/backend/actions/login.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams(creds).toString(),
            redirect: 'follow'
        }).then(function () {
            frame.src = page;
        }).catch(function () {
            document.getElementById('cap').textContent = 'ошибка входа: проверьте, что сервер запущен';
        });
    }
</script>
</body>
</html>
